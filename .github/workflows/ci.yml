name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: aifams_test_admin
          POSTGRES_PASSWORD: aifams_test_local
          POSTGRES_DB: aifams_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aifams_test_admin -d aifams_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      AIFAMS_TEST_DATABASE_URL: postgresql+asyncpg://aifams_test_admin:aifams_test_local@localhost:5432/aifams_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r backend/requirements-dev.txt
      - working-directory: backend
        run: |
          ruff check .
          ruff format --check .
          mypy app
          pytest -q
      - run: pip-audit -r backend/requirements.txt
  web:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infrastructure/docker-compose.yml config --quiet
      - run: docker compose -f infrastructure/docker-compose.yml up --build --wait --wait-timeout 180
      - run: |
          curl --fail http://localhost:8080/
          curl --fail http://localhost:8080/api/v1/health/ready
          curl --fail http://localhost:8000/api/v1/openapi.json
      - if: failure()
        run: docker compose -f infrastructure/docker-compose.yml logs
      - if: always()
        run: docker compose -f infrastructure/docker-compose.yml down --volumes
