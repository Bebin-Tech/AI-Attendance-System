name: aifams
services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: aifams
      POSTGRES_USER: aifams
      POSTGRES_PASSWORD: aifams_local
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aifams -d aifams"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7.4.6-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build: ../backend
    environment:
      AIFAMS_DATABASE_URL: postgresql+asyncpg://aifams:aifams_local@postgres:5432/aifams
      AIFAMS_REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 12
  web:
    build: ../web
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:
